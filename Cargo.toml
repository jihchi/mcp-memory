[package]
name = "mcp-memory"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "OKF-backed persistent memory server for MCP"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "json", "query"] }
futures = "0.3.31"
rmcp = { version = "3.1.2", features = ["transport-io", "transport-streamable-http-server"] }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["preserve_order"] }
serde_yaml_ng = "0.10.0"
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread", "net", "signal"] }
tokio-util = "0.7.18"
tokio-stream = "0.1.17"
time = { version = "0.3.47", features = ["formatting", "macros"] }
uuid = { version = "1.11.0", features = ["v4"] }

[dev-dependencies]
tempfile = "3.24.0"
